# [HERMETIC] pyproject.toml changes for hermetic build:
#   - Added uv + micropipenv as explicit deps (cachi2 prefetches everything in dependencies[])
#   - Added ipykernel + debugpy explicitly (previously pulled transitively)
#   - Added odh-notebooks-meta-workbench-datascience-deps (shared meta-package replacing
#     individual deps like boto3, kafka-python-ng, numpy, pandas, plotly, scipy, scikit-learn)
#   - Upgraded feast ~=0.59.0 (pinned for RHOAI 3.4 compatibility)
#   - Excluded py-spy on ppc64le (maturin can't fetch crates.io in --network=none)
#   - Added urllib3>=2.6.0 override (CVE-2025-66418)
#   - protobuf==6.31.1 override (AIPCC-13675: UPB C extension segfault on s390x)
#   - Added local path source for the meta-package
[project]
name = "notebooks"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # Installer/tooling used in Docker/CI (prefetched with main deps for cachi2 offline)
    "uv",
    "micropipenv[toml]",

    # Base packages
    "wheel",
    "setuptools",

    "ipykernel",
    "debugpy",

    # Datascience packages
    "feast",

    # RHAIENG-1475: skl2onnx excluded on s390x for codeserver
    "skl2onnx; platform_machine != 's390x'",
    "odh-notebooks-meta-workbench-datascience-deps",

    # Some extra useful packages
    "opencensus",
    "smart-open",
    "virtualenv",
    # https://issues.redhat.com/browse/AIPCC-9544 py-spy excluded on ppc64le for codeserver
    "py-spy; platform_machine != 's390x' and platform_machine != 'ppc64le'",
    "prometheus-client",
    "ripgrep",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]

override-dependencies = [
    # AIPCC-13675: protobuf 6.33.6+ UPB C extension segfaults on s390x
    "protobuf==6.31.1",
    # Index gap: aiohttp 3.14.4 ships no s390x wheel on the RHOAI 3.4 index (only
    # aarch64/ppc64le/x86_64), which breaks the hermetic s390x build. 3.14.3 is the
    # newest with an s390x wheel and already satisfies the aiohttp>=3.14.3 CVE floor.
    # Drop this cap once a 3.14.4+ s390x wheel is mirrored.
    "aiohttp<3.14.4",
]

constraint-dependencies = [
    # CVE-2026-27489 (PYSEC-2026-2239): onnx path traversal via symlink (fixed in
    # >=1.21.0). onnx is transitive here (via skl2onnx). Pinned per-image rather than
    # globally because the two rocm-tensorflow images cap onnx<1.19.0; see the onnx
    # NOTE in dependencies/cve-constraints.txt.
    "onnx>=1.21.0",
]

[tool.uv.sources]
odh-notebooks-meta-workbench-datascience-deps = { path = "../../dependencies/odh-notebooks-meta-workbench-datascience-deps" }
