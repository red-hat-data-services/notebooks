---
# Daily dispatcher for downstream RHDS RPM lockfile renewal.
name: RHDS RPM Lock Files Renewal Dispatcher

permissions: {}

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "30 1 * * *"  # Daily RHDS RPM lockfile update (1:30am UTC)
  workflow_dispatch:

concurrency:
  group: rhds-rpm-lockfile-renewal-dispatcher
  cancel-in-progress: false

jobs:
  rhoai-2-25:
    uses: red-hat-data-services/notebooks/.github/workflows/rhds-rpm-lock-renewal.yaml@rhoai-2.25
    secrets: inherit

  rhoai-3-3:
    uses: red-hat-data-services/notebooks/.github/workflows/rhds-rpm-lock-renewal.yaml@rhoai-3.3
    secrets: inherit

  rhoai-3-4:
    uses: red-hat-data-services/notebooks/.github/workflows/rhds-rpm-lock-renewal.yaml@rhoai-3.4
    secrets: inherit

  rhoai-3-5:
    uses: red-hat-data-services/notebooks/.github/workflows/rhds-rpm-lock-renewal.yaml@rhoai-3.5
    secrets: inherit
