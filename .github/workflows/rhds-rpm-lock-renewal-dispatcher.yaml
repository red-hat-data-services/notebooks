---
# Daily dispatcher for downstream RHDS RPM lockfile renewal.
name: RHDS RPM Lock Files Renewal Dispatcher

permissions:
  actions: read

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "30 1 * * *"  # Daily RHDS RPM lockfile update (1:30am UTC)
  workflow_dispatch:

concurrency:
  group: rhds-rpm-lockfile-renewal-dispatcher
  cancel-in-progress: false

jobs:
  main:
    permissions:
      actions: read
      contents: read
      packages: write
      issues: write
      pull-requests: write
    uses: red-hat-data-services/notebooks/.github/workflows/rhds-rpm-lock-renewal.yaml@main
    secrets: inherit

  rhoai-2-25:
