---
name: Validation of software versions referenced in ImageStream manifests
on:  # yamllint disable-line rule:truthy
  push:
    # Since this check is so resource demanding, let's restrict also push action here.
    paths: &trigger_paths
      - '.github/workflows/software-versions.yaml'
      - 'manifests/base/params.env'
      - 'manifests/base/params-latest.env'
      - 'manifests/base/*-imagestream.yaml'
      - 'ci/check-software-versions.py'
  pull_request:
    paths: *trigger_paths
  workflow_dispatch:
  release:

permissions:
  contents: read

jobs:
  validation-of-sw-versions-in-imagestreams:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install git-crypt
        run: |
          set -Eeuxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-crypt

      - name: Unlock encrypted secrets with git-crypt
        run: |
          set -Eeuxo pipefail
          echo "${GIT_CRYPT_KEY}" | base64 --decode > ./git-crypt-key
          trap 'rm -f ./git-crypt-key' EXIT
          git-crypt unlock ./git-crypt-key
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}

      - name: Prepare disk / Podman storage
        run: |
          set -Eeuxo pipefail
          df -h
          free -h

          # opendatahub-io/notebooks#3965; store rootful graphs under /mnt
          sudo mkdir -p /mnt/containers/storage
          sudo chown -R "${USER}:${USER}" /mnt/containers/storage
          sudo cp ci/cached-builds/storage.conf /etc/containers/storage.conf
          sudo mkdir -p /mnt/containers/storage/tmp
          # should reset storage when changing storage.conf
          sudo podman system reset --force

          # quick check that podman works
          sudo podman info

      - name: Configure registry auth for rootful Podman
        run: |
          set -Eeuxo pipefail
          # check-software-versions.py runs under sudo podman; install auth for root.
          sudo mkdir -p /root/.config/containers /root/.docker
          sudo cp ci/secrets/pull-secret.json /root/.config/containers/auth.json
          sudo cp ci/secrets/pull-secret.json /root/.docker/config.json
          mkdir -p "${HOME}/.config/containers" "${HOME}/.docker"
          cp ci/secrets/pull-secret.json "${HOME}/.config/containers/auth.json"
          cp ci/secrets/pull-secret.json "${HOME}/.docker/config.json"

      - name: Check software versions in manifest referencing the images
        id: software-versions-check
        run: |
          sudo ./ci/check-software-versions.py --prune-podman-data
