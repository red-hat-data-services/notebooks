    if: github.event.action != 'labeled' || github.event.label.name == 'run-gatekeeper'
    uses: red-hat-data-services/devops-shared-resources/.github/workflows/post-codefreeze-gate-logic.yml@0eb1ea75480da0b41d3e131cb60de71a18ef5e6e  # main
    secrets: inherit
