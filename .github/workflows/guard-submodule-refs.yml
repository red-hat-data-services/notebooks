---
name: Guard submodule refs

"on":
  pull_request:
    paths:
      - "codeserver/ubi9-python-3.12/prefetch-input/code-server"
      - "codeserver-baseline/ubi9-python-3.12/prefetch-input/code-server"
      - "prefetch-input/mongocli"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check submodule ref changes
        run: python ci/hooks/guard_submodule_refs.py --ci --base-ref origin/${{ github.base_ref }}
