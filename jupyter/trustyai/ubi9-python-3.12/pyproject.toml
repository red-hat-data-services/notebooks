[project]
name = "trustyai-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # PyTorch packages
    "torch==2.7.1+cpu; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    # Keep Torch's otherwise exclusive dependency locked on IBM architectures too.
    "sympy>=1.13.3",

    # TrustyAI packages
    # More information available at:
    #   - https://pypi.org/project/trustyai/
    #   - https://github.com/trustyai-explainability/trustyai-explainability-python/blob/main/requirements.txt
    "transformers~=4.56.1",
    "datasets~=4.0.0",
    "accelerate~=1.10.1",
    "trustyai~=0.6.4",
    # Datascience and useful extensions
    "boto3~=1.40.52",
    "kafka-python-ng~=2.2.3",
    "kfp~=2.14.6",
    "matplotlib~=3.10.7", # Should be pinned down to this version in order to be compatible with trustyai
    "numpy~=1.26.4", # Should be pinned down to this version in order to be compatible with trustyai
    "pandas~=2.3.3", # trustyai 0.6.4 requires pandas>=2.1.0
    "plotly~=6.3.1",
    "scikit-learn~=1.7.2", # Should be pinned down to this version in order to be compatible with trustyai
    "scipy~=1.16.2",
    "skl2onnx~=1.19.1",
    "onnxconverter-common~=1.13.0", # Required for skl2onnx, as upgraded version is not compatible with protobuf
    "codeflare-sdk~=0.39.1; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    "kubeflow-training==1.9.3",

    # DB connectors
    "pymongo~=4.15.3",
    "psycopg~=3.2.10",
    "pyodbc~=5.2.0",
    "mysql-connector-python~=9.4.0",

    # JupyterLab packages
    "odh-elyra==4.3.3",
    "odh-jupyter-trash-cleanup==0.1.1",

    "jupyterlab==4.6.2",
    "jupyter-bokeh~=4.0.5", # trustyai 0.6.4 depends on jupyter-bokeh~=4.0.5
    "jupyter-server~=2.20.0",
    "jupyter-server-proxy~=4.4.0",
    "jupyter-server-terminals~=0.5.3",
    "jupyterlab-git~=0.51.2",
    "jupyterlab-lsp~=5.1.1",
    "jupyterlab-widgets~=3.0.15",
    "jupyter-resource-usage~=1.1.1",
    "nbdime~=4.0.2",
    "nbgitpuller~=1.2.2",

    # Base packages
    "wheel~=0.46.2",
    "setuptools~=80.9.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython' and python_full_version == '3.12.*'",
]
override-dependencies = [
    # IBM architectures install a locally built CPU wheel before the locked environment.
    # Apply the same marker to transitive requirements from packages such as accelerate.
    "torch==2.7.1+cpu; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    # RHAIENG-5052: CVE-2026-39892 — force past codeflare-sdk pin cryptography==46.0.3
    "cryptography>=46.0.7",
    # RHOAIENG-59282 + RHOAIENG-54270: CVE-2026-23490 + CVE-2026-30922 pyasn1 DoS vulnerabilities
    "pyasn1>=0.6.4",
    # RHAIENG-2458: CVE-2025-66418 urllib3 decompression vulnerability
    # odh-elyra -> appengine-python-standard caps urllib3<2; override required (constraints unsatisfiable)
    # Upstream: https://github.com/elyra-ai/elyra/issues/3325
    "urllib3>=2.6.0",
    # RHAIENG-6855: codeflare-sdk 0.39.1 / kube-authkit needs kubernetes>=35; kfp caps kubernetes<31
    "kubernetes>=35.0.0",
]
constraint-dependencies = [
    # RHAIENG-4275: CVE-2026-27489 ONNX path traversal vulnerability
    "onnx>=1.22.0",
]

[tool.uv.pip]
torch-backend = "cpu"
