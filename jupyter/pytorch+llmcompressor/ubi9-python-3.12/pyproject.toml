# https://docs.astral.sh/uv/concepts/projects/config/
[project]
name = "pytorch-llmcompressor-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

# https://docs.astral.sh/uv/concepts/projects/workspaces/#when-not-to-use-workspaces
dependencies = [
    # see https://redhat-internal.slack.com/archives/C079FE5H94J/p1756933987117709?thread_ts=1756933154.294109&cid=C079FE5H94J
    # for a discussion on what version of torch to use

    # PyTorch packages
    "tensorboard~=2.20.0",
    "torch==2.11.0",
    "torchvision~=0.26.0",

    # LLMCompressor 0.14.0 is required for the patched Torch/Transformers dependency stack.
    "llmcompressor==0.14.0",

    # Datascience and useful extensions
    "boto3~=1.40.27",
    "kafka-python-ng~=2.2.3",
    "kfp~=2.17.0",
    "matplotlib~=3.10.6",
    "numpy~=2.2.6",
    "pandas~=2.3.2",
    "plotly~=6.3.0",
    "scikit-learn~=1.7.2",
    "scipy~=1.16.1",
    "skl2onnx~=1.19.1",
    "onnxconverter-common~=1.16.0",  # ONNX 1.21+ (skl2onnx); was ~=1.13.0
    "onnx>=1.22.0; platform_machine != 's390x'",  # CVE-2026-28500
    "kubeflow-training==1.9.4",
    "lm-eval~=0.4.9",
    "feast>=0.63.0",

    # DB connectors
    "pymongo~=4.14.1",
    "psycopg~=3.2.10",
    "pyodbc~=5.2.0",
    "mysql-connector-python~=9.4.0",

    # JupyterLab packages
    "odh-elyra==5.0.2",
    "odh-jupyter-trash-cleanup==0.1.1",

    "jupyterlab==4.6.3",
    "jupyter-bokeh~=4.0.5",
    "jupyter-server~=2.21.0",
    "jupyter-server-proxy~=4.4.0",
    "jupyter-server-terminals~=0.5.3",
    "jupyterlab-git~=0.54.0",
    "jupyterlab-lsp~=5.1.0",
    "jupyterlab-widgets~=3.0.15",
    "jupyter-resource-usage~=1.2.1",
    "nbdime~=4.0.2",
    "nbgitpuller~=1.2.2",

    # Base packages
    "wheel~=0.46.2",
    "setuptools>=80.9.0,<82",
]

# https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-sources
[tool.uv.sources]
# https://docs.astral.sh/uv/guides/integration/pytorch/#using-uv-with-pytorch
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

# https://docs.astral.sh/uv/concepts/indexes/#package-indexes
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# https://docs.astral.sh/uv/concepts/resolution/#dependency-overrides
# https://docs.astral.sh/uv/reference/settings/#override-dependencies
[tool.uv]
# RHAIIS model-opt uses constraints.txt only (fromager has no uv-style overrides).
# RHAIIS pins are mirrored in constraint-dependencies; overrides below are
# notebooks-only where constraints cannot replace a transitive upper bound.
override-dependencies = [
    "protobuf==7.36.1",
    # RHAIENG-6097+: llmcompressor caps pillow<=12.2.0
    "pillow>=12.3.0",
    # RHAIENG-5789/5895: jupyterlab CVE batch (odh-elyra 5.0.2 jupyterlab override)
    "jupyterlab>=4.5.7",
    # RHAIENG-2458: elyra pins urllib3 below RHAIIS/CVE floor; constraints alone do not replace transitive caps
    "urllib3>=2.7.0",
    # RHOAIENG-53183: notebooks-only CVE (not in RHAIIS model-opt constraints.txt)
    "black>=26.3.1",
    # feast~=0.54.1 caps pyarrow<=17; RHAIIS constraints.txt requires pyarrow>=23 (CVE floor)
    "pyarrow>=23.0.1,<24.0.0",
]

# Security floors aligned with the RHOAI 2.25 dependency scan and LLMCompressor 0.14.0.
constraint-dependencies = [
    "loguru==0.7.3",
    "pyyaml==6.0.2",
    "numpy==2.2.6",
    "tqdm==4.67.1",
    "transformers==5.17.0",
    "datasets==5.0.1",
    "accelerate==1.15.0",
    "pynvml==12.0.0",
    "pillow>=12.3.0",
    "urllib3>=2.7.0",
    "aiohttp>=3.14.0",
    "filelock>=3.20.3",
    "python-dotenv>=1.2.2",
    "pyarrow>=23.0.1,<24.0.0",
]

environments = [
    "python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    # aarch64 omitted: lock resolution fails — torchvision==0.22.1+cu128 has no linux/aarch64 wheels
]
