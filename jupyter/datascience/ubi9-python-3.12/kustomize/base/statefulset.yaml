---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notebook
  annotations:
    opendatahub.io/username: jovyan
  labels:
    opendatahub.io/user: jovyan
spec:
  replicas: 1
  selector: {}
  serviceName: notebook
  template:
    metadata:
      labels: {}
    spec:
      containers:
        - name: notebook
          image: quay.io/opendatahub/workbench-images:jupyter-datascience-ubi9-python-3.12
          imagePullPolicy: Always
          workingDir: /opt/app-root/src
          env:
            - name: MPLBACKEND
              value: Agg
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/opendatahub/jovyan
                --ServerApp.quit_button=False
          ports:
            - name: notebook-port
              protocol: TCP
              containerPort: 8888
          # Allow up to 10 minutes for startup on slow or constrained nodes (e.g. ppc64le in CI).
          startupProbe:
            tcpSocket:
              port: notebook-port
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: notebook-port
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /notebook/opendatahub/jovyan/api
              port: notebook-port
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          # Jupyter + papermill share the pod cgroup; datascience unittest imports need >8Gi on ppc64le CI.
          resources:
            limits:
              cpu: "2"
              memory: 12Gi
            requests:
              cpu: "2"
              memory: 12Gi
