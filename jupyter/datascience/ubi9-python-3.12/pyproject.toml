[project]
name = "datascience-notebook"
version = "0.1.0"
requires-python = "==3.12.*"

dependencies = [
    # Hermetic cpu-base: prefetched with the rest of the stack (see repo-root prefetch-input/ and jupyter/minimal pyproject)
    "uv==0.11.0",
    "micropipenv[toml]==1.10.0",

    # Datascience and useful extensions
    "codeflare-sdk; platform_machine != 'ppc64le' and platform_machine != 's390x'",
    "feast",
    "skl2onnx",
    "odh-notebooks-meta-workbench-datascience-deps",
    "odh-notebooks-meta-db-connectors-deps",
    "odh-notebooks-meta-jupyterlab-deps",
    "odh-notebooks-meta-jupyterlab-datascience-deps",

    # Base packages
    "wheel",
    "setuptools",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]

constraint-dependencies = [
    # CVE-2026-27489 (PYSEC-2026-2239): onnx path traversal via symlink (fixed in
    # >=1.21.0). onnx is transitive here (via skl2onnx / onnxconverter-common / tf2onnx).
    # Pinned per-image rather than globally -- the two rocm-tensorflow images cap
    # onnx<1.19.0; see the onnx NOTE in dependencies/cve-constraints.txt.
    "onnx>=1.21.0",
    # ray 2.56.0 (CVE-2026-57516 override above) requires pydantic>=2.13 for
    # python>=3.14, and universal resolution would unify on the newest mirrored
    # pydantic (2.13.4). On the cpu-ubi9 index pydantic-core 2.46.3+/2.47.0
    # (paired with pydantic 2.13.3+) are mirrored s390x-ONLY -- no
    # x86_64/aarch64/ppc64le wheels -- so pydantic 2.13.4 is uninstallable off
    # s390x. pydantic 2.13.1 -> pydantic-core 2.46.1 is the newest fully
    # mirrored pair; cap here until the index mirrors the newer cores completely.
    "pydantic<=2.13.1",
]

override-dependencies = [
    # RHAIENG-2458: CVE-2025-66418 urllib3 - override needed because odh-elyra pulls in
    # appengine-python-standard which has an obnoxious urllib3<2 constraint
    "urllib3>=2.6.0",
    # AIPCC-13675: protobuf 6.33.6+ UPB C extension segfaults on s390x
    "protobuf==6.31.1",
    # CVE-2026-57516 / RHOAIENG-82680: Ray RCE via unsafe deserialization in the
    # WebDataset reader, fixed in ray 2.56.0. ray 2.56.0 is already mirrored on all
    # RHOAI 3.4 index flavors, but codeflare-sdk 0.36.0 (index max) pins
    # ray[data,default]==2.53.0 exactly, so the pin is overridden.
    "ray[data,default]==2.56.0",
]

[tool.uv.sources]
odh-notebooks-meta-workbench-datascience-deps = { path = "../../../dependencies/odh-notebooks-meta-workbench-datascience-deps" }
odh-notebooks-meta-db-connectors-deps = { path = "../../../dependencies/odh-notebooks-meta-db-connectors-deps" }
odh-notebooks-meta-jupyterlab-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-deps" }
odh-notebooks-meta-jupyterlab-datascience-deps = { path = "../../../dependencies/odh-notebooks-meta-jupyterlab-datascience-deps" }
