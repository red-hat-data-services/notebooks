apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/(build-konflux|build-runtime-tensorflow-rocm)"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && ! ("manifests/rhoai/base/params-latest.env".pathChanged())
      && (".tekton/odh-pipeline-runtime-tensorflow-rocm-py312-pull-request.yaml".pathChanged() || "runtimes/rocm-tensorflow/ubi9-python-3.12/**".pathChanged())
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-pipeline-runtime-tensorflow-rocm-py312-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-pipeline-runtime-tensorflow-rocm-py312-on-pull-request-53829
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-pipeline-runtime-tensorflow-rocm-py312-rhel9:on-pr-{{pull_request_number}}
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-pipeline-runtime-tensorflow-rocm-py312
  - name: dockerfile
    value: runtimes/rocm-tensorflow/ubi9-python-3.12/Dockerfile.konflux.rocm
  - name: build-args-file
    value: runtimes/rocm-tensorflow/ubi9-python-3.12/build-args/konflux.rocm.conf
  - name: path-context
    value: .
  - name: enable-cache-proxy
    value: true
  - name: hermetic
    value: 'true'
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: prefetch-input
    value:
    - path: prefetch-input/rhds
      type: rpm
    - path: runtimes/rocm-tensorflow/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64"
      requirements_files: [requirements.rocm.txt]
  - name: rhoai-version
    value: "3.6.0"
  - name: build-source-image
    value: true
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  timeouts:
    pipeline: 8h
    tasks: 4h
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      requests:
        cpu: '8'
        memory: 16Gi
      limits:
        cpu: '16'
        memory: 32Gi
  - pipelineTaskName: clair-scan
    computeResources:
      requests:
        cpu: '8'
        memory: 16Gi
      limits:
        cpu: '16'
        memory: 32Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-pipeline-runtime-tensorflow-rocm-py312-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
