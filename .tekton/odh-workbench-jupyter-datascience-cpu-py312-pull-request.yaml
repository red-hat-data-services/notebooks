apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/notebooks?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-comment: "^/(build-konflux|build-jupyter-datascience)"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && ! ("manifests/rhoai/base/params-latest.env".pathChanged())
      && (".tekton/odh-workbench-jupyter-datascience-cpu-py312-pull-request.yaml".pathChanged() || "jupyter/utils/**".pathChanged() || "jupyter/minimal/ubi9-python-3.12/**".pathChanged() || "jupyter/minimal/ubi9-python-3.12/start-notebook.sh".pathChanged() || "jupyter/datascience/ubi9-python-3.12/**".pathChanged() || "jupyter/datascience/ubi9-python-3.12/build-args/konflux.cpu.conf".pathChanged() || "prefetch-input/rhds/**".pathChanged() || "prefetch-input/mongocli/**".pathChanged())
  labels:
    appstudio.openshift.io/application: rhoai-v3-6
    appstudio.openshift.io/component: odh-workbench-jupyter-datascience-cpu-py312-v3-6
    pipelines.appstudio.openshift.io/type: build
  name: odh-workbench-jupyter-datascience-cpu-py312-on-pull-request-40693
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-workbench-jupyter-datascience-cpu-py312-rhel9:on-pr-{{pull_request_number}}
  - name: additional-labels
    value:
    - version=on-pr-{{revision}}
    - io.openshift.tags=odh-workbench-jupyter-datascience-cpu-py312
  - name: dockerfile
    value: jupyter/datascience/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: build-args-file
    value: jupyter/datascience/ubi9-python-3.12/build-args/konflux.cpu.conf
  - name: path-context
    value: .
  - name: enable-cache-proxy
    value: true
  - name: hermetic
    value: 'true'
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux-d160-m8xlarge/amd64
    - linux-d160-m8xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: prefetch-input
    value:
    - path: prefetch-input/mongocli
      type: gomod
    - path: prefetch-input/rhds
      type: rpm
    - path: jupyter/datascience/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64,aarch64,ppc64le,s390x"
      requirements_files: [requirements.cpu.txt]
  - name: rhoai-version
    value: "3.6.0"
  - name: build-source-image
    value: true
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ cel: pac.target_branch.matches("^rhoai-\\d+\\.\\d+(-ea\\.\\d+)?$") ? pac.target_branch : "main" }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  timeouts:
    pipeline: 8h
    tasks: 4h
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: build-images
    stepSpecs:
    - name: prepare-sboms
      computeResources:
        requests:
          cpu: '3'
          memory: 8Gi
        limits:
          cpu: '3'
          memory: 8Gi
    - name: build
      computeResources:
        requests:
          cpu: '3'
          memory: 8Gi
        limits:
          cpu: '3'
          memory: 8Gi
  - pipelineTaskName: clair-scan
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-datascience-cpu-py312-v3-6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
