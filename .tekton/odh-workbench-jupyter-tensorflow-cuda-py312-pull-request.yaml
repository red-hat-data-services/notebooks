      type: gomod
    - path: prefetch-input/rhds
      type: rpm
    - path: jupyter/tensorflow/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64,aarch64"
      requirements_files: [requirements.cuda.txt]
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
