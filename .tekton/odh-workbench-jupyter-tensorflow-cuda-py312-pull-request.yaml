  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: jupyter/tensorflow/ubi9-python-3.12/Dockerfile.konflux.cuda
  - name: path-context
    value: .
  - name: enable-cache-proxy
    value: true
  # Hermetic: gomod (mongocli), RPM (prefetch-input/rhds), pip (requirements.cuda.txt); Dockerfiles COPY prefetch-input/mongocli
  - name: hermetic
    value: 'true'
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-d160-m4xlarge/arm64
  - name: build-args-file
    value: jupyter/tensorflow/ubi9-python-3.12/build-args/konflux.cuda.conf
  - name: rhel-subscription-activation-key
