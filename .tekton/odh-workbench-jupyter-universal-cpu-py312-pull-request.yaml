apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: odh-workbench-jupyter-unive-7a2f0cac-on-pull-request-{{pull_request_number}}
  labels:
    appstudio.openshift.io/application: rhoai-v3-7-ea-1
    appstudio.openshift.io/component: odh-workbench-jupyter-universal-cpu-py312-v3-7-ea-1
    pipelines.appstudio.openshift.io/type: build
  namespace: rhoai-tenant
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^/(build-konflux|build-jupyter-universal)"
    build.appstudio.openshift.io/repo: "https://github.com/red-hat-data-services/notebooks?rev={{revision}}"
    build.appstudio.redhat.com/commit_sha: "{{revision}}"
    build.appstudio.redhat.com/target_branch: "{{target_branch}}"
    build.appstudio.redhat.com/pull_request_number: "{{pull_request_number}}"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request"
      && target_branch == "rhoai-3.7-ea.1"
      && ((files.all.exists(p, ! p.matches('^\\.tekton/')) || ".tekton/odh-workbench-jupyter-universal-cpu-py312-pull-request.yaml".pathChanged()))
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-workbench-jupyter-universal-cpu-py312-rhel9:on-pr-{{pull_request_number}}
  - name: rhoai-version
    value: "3.7.0-ea.1"
  - name: dockerfile
    value: jupyter/universal/ubi9-python-3.12/Dockerfile.konflux.cpu
  - name: build-args-file
    value: jupyter/universal/ubi9-python-3.12/build-args/konflux.cpu.conf
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: rhel-subscription-activation-key
    value: rhel-subscription-activation-key-rhoai-devops-for-notebooks-rhel9-6
  - name: prefetch-input
    value:
    - path: prefetch-input/mongocli
      type: gomod
    - path: prefetch-input/rhds
      type: rpm
    - path: jupyter/universal/ubi9-python-3.12
      type: pip
      binary:
        arch: "x86_64,aarch64,ppc64le,s390x"
      requirements_files: [requirements.cpu.txt]
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  - name: image-expires-after
    value: 30d
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: 'rhoai-3.7-ea.1'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
    resolver: git
  taskRunSpecs:
  - pipelineTaskName: prefetch-dependencies
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: build-images
    stepSpecs:
    - name: prepare-sboms
      computeResources:
        requests:
          cpu: '3'
          memory: 8Gi
        limits:
          cpu: '3'
          memory: 8Gi
    - name: build
      computeResources:
        requests:
          cpu: '3'
          memory: 8Gi
        limits:
          cpu: '3'
          memory: 8Gi
  - pipelineTaskName: clair-scan
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: ecosystem-cert-preflight-checks
    computeResources:
      requests:
        cpu: '3'
        memory: 8Gi
      limits:
        cpu: '3'
        memory: 8Gi
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-workbench-jupyter-universal-cpu-py312-v3-7-ea-1
    podTemplate:
      imagePullSecrets:
      - name: redhat-appstudio-staginguser-pull-secret
  timeouts:
    pipeline: 2h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
